<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCycleTech</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="scripts.js"></script>
</head>
<body>
    <header class="navbar">
  <div class="nombrenb">
    <span class="brand-nombre">NovaCycle Tech</span>
    <span class="brand-subnombre">Gestión de residuos urbanos</span>
  </div>

  <div class="botoneslog">
    <span class="Iniciarsesionnb"><button id="btnNavbarIniciarSesion">Iniciar sesion</button></span>
    <span class="Registrarsenb"><button id="btnNavbarRegistro">Registrarse</button></span>
  </div>
</header>

<div class="contenido_principal">
    <span class="bienvenida">Bienvenido a NovaCycle Tech</span>
    <p class="descripcionb">NovaCycle centraliza la administración de contenedores, incidencias, flotas de recolección y reportes estadísticos para una gestión municipal más eficiente.</p>
</div>

<div class="Botones_principal">
  <span class="Crear_cuenta"><button id="btnCrearCuenta">Crear cuenta →</button></span>
  <span class="Iniciarsesion_principal"><button id="btnIniciarSesion">Iniciar sesion</button></span>
</div>

<script >document.addEventListener('DOMContentLoaded', () => {
  const btnCrearCuenta = document.getElementById('btnCrearCuenta');
  const btnIniciarSesion = document.getElementById('btnIniciarSesion');
  const btnNavbarIniciarSesion = document.getElementById('btnNavbarIniciarSesion');
  const btnNavbarRegistro = document.getElementById('btnNavbarRegistro');

  const botones = [
    { elemento: btnCrearCuenta, mensaje: 'Crear cuenta' },
    { elemento: btnIniciarSesion, mensaje: 'Iniciar sesión' },
    { elemento: btnNavbarIniciarSesion, mensaje: 'Iniciar sesión desde navbar' },
    { elemento: btnNavbarRegistro, mensaje: 'Registrarse' }
  ];

  botones.forEach(({ elemento, mensaje }) => {
    if (elemento) {
      elemento.addEventListener('click', () => {
        console.log(`Hiciste clic en: ${mensaje}`);
      });
    }
  });
});
</script> 
</body>
</html>
