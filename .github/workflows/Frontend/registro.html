<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCycle Tech | Registro</title>
</head>
<body>
    <div class="formulario">
        <h1>Registro de usuario</h1>
        <p>Por favor, complete el siguiente formulario para registrarse.</p>
        <form id="formRegistro">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required><br><br>

            <label for="CI">Cédula de identidad:</label>
            <input type="text" id="CI" name="CI" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" minlength="8" required><br><br>

            <label for="rol_solicitado">Puesto solicitado:</label>
            <select id="rol_solicitado" name="rol_solicitado" required>
                <option value="peon">Peón de recolección</option>
                <option value="conductor">Conductor</option>
                <option value="operario">Operario</option>
            </select><br><br>
            <input type="submit" value="Enviar solicitud">
        </form>
        <p id="mensajeRegistro" role="alert" hidden></p>
    </div>
    <script src="auth.js?v=2"></script>
</body>
</html>
