<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div class="formulario">
        <h1>Registro de Usuario</h1>
        <p>Por favor, complete el siguiente formulario para registrarse.</p>
    <form action="/Proyecto/proyecto/.github/workflows/Api_Usuarios/vista.php?accion=registrar" method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required><br><br>
        <label for="CI">Cédula de Identidad:</label>
        <input type="text" id="CI" name="CI" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña" name="password" required><br><br>

        <label for="rol_solicitado">Puesto solicitado:</label>
<select id="rol_solicitado" name="rol_solicitado" required>
  <option value="peon">Peón de recolección</option>
  <option value="conductor">Conductor</option>
  <option value="operario">Operario</option>
</select><br><br>
        <input type="submit" value="Enviar">
    </form>
</div>
</body>
</html>
